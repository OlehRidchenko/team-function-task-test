
name: Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests if Python files changed
        shell: bash
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -Eq '\.py$'; then
            python -m unittest -v
          else
            echo "No Python files changed. Tests skipped."
          fi
